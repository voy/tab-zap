<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Vote for an avatar</title><style>
*{box-sizing:border-box}body{margin:0;background:#350c3e;font-family:Arial,sans-serif}.sheet{width:480px;height:320px;background:#350c3e;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(2,1fr);padding:16px;gap:12px}.option{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}.option img{width:32px;height:32px;border-radius:8px;outline:2px solid #ffffff;outline-offset:2px}.number{font-size:20px;font-weight:700;color:#ffffff;line-height:24px}
</style></head><body><main class="sheet" aria-label="Six numbered Slack avatars for voting"><div class="option"><img src="01-spoon-grave.png" alt="Spoon grave marker"><span class="number">1</span></div><div class="option"><img src="02-spoon-headstone.png" alt="Bent-spoon headstone"><span class="number">2</span></div><div class="option"><img src="03-rip-sticky.png" alt="RIP sticky note"><span class="number">3</span></div><div class="option"><img src="04-coat-of-arms.png" alt="Corporate coat of arms"><span class="number">4</span></div><div class="option"><img src="05-spoon-monument.png" alt="Spoon monument"><span class="number">5</span></div><div class="option"><img src="06-sticky-spoon.png" alt="Sticky note and spoon"><span class="number">6</span></div></main></body></html>
